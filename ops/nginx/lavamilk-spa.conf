# Include inside the existing lavamilk.club server block.
# Replace an existing location / instead of declaring it twice.
# Keep the existing /api/pig-king/ and /api/ reverse proxies unchanged.
location / {
    try_files $uri $uri/ /index.html;
}

# Missing static assets must remain 404, never return the SPA HTML.
location ^~ /assets/ {
    try_files $uri =404;
}
location ^~ /images/ {
    try_files $uri =404;
}
location ^~ /emoji/ {
    try_files $uri =404;
}
