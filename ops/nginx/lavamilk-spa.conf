# Include inside the existing lavamilk.club server block.
# Replace an existing location / instead of declaring it twice.
# Keep the existing /api/pig-king/ and /api/ reverse proxies unchanged.
location / {
    try_files $uri $uri/ /index.html;
}

# Missing static assets must remain 404, never return the SPA HTML.
location ^~ /assets/ {
    try_files $uri =404;
}
location ^~ /images/ {
    try_files $uri =404;
}
location ^~ /emoji/ {
    try_files $uri =404;
}

# The independently built AI chat preview has its own entry point.
location ^~ /ai-chat/assets/ {
    try_files $uri =404;
}
location = /ai-chat/index.html {
    add_header Cache-Control "no-cache";
}
location /ai-chat/ {
    try_files $uri $uri/ /ai-chat/index.html;
}
