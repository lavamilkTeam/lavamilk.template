name: Check and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: lavamilk_test
          MYSQL_USER: tester
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://tester:ci-test-only@127.0.0.1:3306/lavamilk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            apps/ai-agent/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix apps/ai-agent
      - run: npx playwright install --with-deps chromium
      - run: npm run check:all
      - run: python3 ops/deploy/package.py release.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://lavamilk.club
    concurrency:
      group: lavamilk-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - name: Deploy verified artifact
        env:
          DEPLOY_KEY: ${{ secrets.LAVAMILK_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LAVAMILK_KNOWN_HOSTS }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Missing LAVAMILK_DEPLOY_KEY secret'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Missing LAVAMILK_KNOWN_HOSTS secret'; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/deploy_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/deploy_hosts"
          ssh -T -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/deploy_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            root@45.192.97.209 "deploy $COMMIT $RUN_NUMBER" < release.tar.gz
