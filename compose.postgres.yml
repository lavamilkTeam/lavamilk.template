name: lavamilk-postgres-local
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavamilk_dev
      POSTGRES_DB: lavamilk_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavamilk_dev -d lavamilk_local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
